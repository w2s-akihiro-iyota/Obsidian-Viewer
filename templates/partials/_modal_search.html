    <!-- Search Modal -->
    <div id="search-modal" class="search-modal">
        <div class="search-modal-content" data-shortcut-place="{{ shortcuts.FOCUS_QUICK_SWITCHER }}">
            <div class="search-modal-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="search-icon-modal">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="modal-search-input" placeholder="ノートを検索…（tag:会議 path:フォルダ で絞り込み）" autocomplete="off" aria-label="ノートを検索">
                <button id="close-search-modal" class="close-modal-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="modal-search-results" class="search-modal-results" role="listbox" aria-label="検索結果"></div>
            {# 下の段は定義から描く（クイックスイッチャーのキー＋どの画面でも使える Esc） #}
            <div class="search-modal-footer key-hint-bar">{{ sc.hint_items(shortcuts.group("quick-switcher"), [shortcuts.find_shortcut("global", ("Esc",))]) }}</div>
        </div>
    </div>
